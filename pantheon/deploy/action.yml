name: 'Deploy to Pantheon'
description: 'Deploys a repository to a Pantheon development or multidev environment.'
author: 'padillaco'
branding:
  icon: 'cloud-lightning'
  color: 'yellow'
inputs:
  base_directory:
    description: 'Base directory for rsync'
    required: false
    default: '.'
  destination_directory:
    description: 'Destination directory for rsync in remote repository'
    required: false
    default: '.'
  exclude_list:
    description: 'Comma-separated list of files and directories to exclude from sync'
    required: false
    default: '.git, .github, .gitmodules, node_modules'
  pantheon_site_id:
    description: 'The Pantheon site ID to deploy to'
    required: true
  ssh_private_key:
    description: 'SSH private key to use for remote repository authentication'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Set Output Variables - Multidev Branch Name
      if: startsWith(github.ref_name, 'multidev/') || startsWith(github.ref_name, 'feature/multidev/') || ((startsWith(github.event.workflow_run.head_branch, 'multidev/') || startsWith(github.event.workflow_run.head_branch, 'feature/multidev/')) && (github.event.workflow.name == 'Pantheon Create Multidev Environment' || github.event.workflow.name == 'Pantheon - Create/Delete Multidev Environment'))
      shell: bash
      id: multidev-branch-name
      env:
        HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      run: |
        set -euo pipefail
        branch_name="$GITHUB_REF_NAME"
        if [[ "$branch_name" != multidev/* && "$branch_name" != feature/multidev/* ]]; then
          branch_name="$HEAD_BRANCH"
        fi

        case "$branch_name" in
          multidev/*) multidev_name="${branch_name#multidev/}" ;;
          feature/multidev/*) multidev_name="${branch_name#feature/multidev/}" ;;
          *) echo "Unsupported Multidev branch: $branch_name" >&2; exit 1 ;;
        esac
        if [[ "$multidev_name" == */* || ! "$multidev_name" =~ ^[a-z0-9][a-z0-9-]{0,10}$ ]]; then
          echo "Pantheon Multidev names must be a single lowercase segment, up to 11 characters, using letters, numbers, or hyphens: $multidev_name" >&2
          exit 1
        fi
        echo "name=$multidev_name" >> "$GITHUB_OUTPUT"

    - name: Push to Remote Repository
      uses: padillaco/auto-deploy/push-to-remote-repo@v1
      with:
        base_directory: ${{ inputs.base_directory }}
        destination_directory: ${{ inputs.destination_directory }}
        exclude_list: ${{ inputs.exclude_list }}
        remote_repo: 'ssh://codeserver.dev.${{ inputs.pantheon_site_id }}@codeserver.dev.${{ inputs.pantheon_site_id }}.drush.in:2222/~/repository.git'
        remote_branch: ${{ steps.multidev-branch-name.outputs.name || 'master' }}
        ssh_private_key: ${{ inputs.ssh_private_key }}
        # Only force push to newly created multidev environment just incase it is not
        # up to date with the dev branch
        force_push: ${{ steps.multidev-branch-name.outputs.name && 'true' || 'false' }}
